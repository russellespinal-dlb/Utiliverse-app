<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Contact Us | Utiliverse</title>
<meta name="theme-color" content="#020617">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin: 0; background: #020617; color: #f8fafc; font-family: Inter, system-ui, sans-serif; }
  .glass { background: rgba(30,41,59,.72); border: 1px solid #334155; }
  .input { background: #0f172a; border: 1px solid #475569; color: #f8fafc; transition: all 0.3s ease; }
  .input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
  .btn { background: linear-gradient(135deg,#6366f1,#4f46e5); color: #fff; border-radius: 8px; padding: 0.75rem 1.5rem; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
  .btn:hover { filter: brightness(1.1); }
</style>
</head>
<body>
<header class="sticky top-0 z-50 bg-slate-950/80 backdrop-blur-xl border-b border-slate-800">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
    <a href="/" class="text-sm font-semibold text-slate-300 hover:text-white flex items-center gap-2"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Utiliverse</a>
  </div>
</header>
<main class="max-w-2xl mx-auto px-4 sm:px-6 py-12">
  <h1 class="text-4xl font-black mb-4">Get in Touch</h1>
  <p class="text-slate-400 mb-8 text-lg">Have a suggestion for a new tool, found a bug, or just want to say hello? Fill out the form below and we'll get back to you.</p>

  <form action="#" method="POST" class="glass p-6 sm:p-8 rounded-2xl flex flex-col gap-5">
    <div>
      <label for="name" class="block text-sm font-medium text-slate-300 mb-2">Name</label>
      <input type="text" id="name" name="name" required class="input w-full rounded-xl p-3" placeholder="John Doe">
    </div>
    
    <div>
      <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
      <input type="email" id="email" name="email" required class="input w-full rounded-xl p-3" placeholder="john@example.com">
    </div>

    <div>
      <label for="subject" class="block text-sm font-medium text-slate-300 mb-2">Subject</label>
      <select id="subject" name="subject" class="input w-full rounded-xl p-3">
        <option>General Inquiry</option>
        <option>Tool Suggestion</option>
        <option>Bug Report</option>
        <option>Business / Advertising</option>
      </select>
    </div>

    <div>
      <label for="message" class="block text-sm font-medium text-slate-300 mb-2">Message</label>
      <textarea id="message" name="message" rows="5" required class="input w-full rounded-xl p-3 resize-none" placeholder="How can we help?"></textarea>
    </div>

    <button type="submit" class="btn mt-2 self-start flex items-center gap-2">
      Send Message <i data-lucide="send" class="w-4 h-4"></i>
    </button>
  </form>
</main>
<footer class="border-t border-slate-800 bg-slate-950 mt-12">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-8 text-sm text-slate-500">
    © <span id="year"></span> Utiliverse. All rights reserved.
  </div>
</footer>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  lucide.createIcons();
</script>
</body>
</html>
