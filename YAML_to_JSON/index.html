<script>
function convert() {
    const s = document.getElementById('yaml').value;
    
    // Clear output if the input box is empty
    if (!s.trim()) {
        document.getElementById('json').value = '';
        document.getElementById('status').textContent = 'Ready';
        return;
    }

    try {
        const obj = jsyaml.load(s);
        document.getElementById('json').value = JSON.stringify(obj, null, 2);
        document.getElementById('status').textContent = 'Conversion complete';
    } catch(e) {
        document.getElementById('status').textContent = 'Error: ' + e.message;
    }
}

function loadYaml() {
    // A single-line string with \n prevents minifier and editor formatting breaks
    document.getElementById('yaml').value = 'name: Utiliverse\ncategory: utilities\nfree: true\nfeatures:\n  - calculators\n  - converters\nsettings:\n  theme: midnight\n  version: 1';
    convert();
}

function copyOut() {
    navigator.clipboard.writeText(document.getElementById('json').value);
}

function clearAll() {
    document.getElementById('yaml').value = '';
    document.getElementById('json').value = '';
    document.getElementById('status').textContent = 'Ready';
}

document.getElementById('yaml').addEventListener('input', convert);
</script>
