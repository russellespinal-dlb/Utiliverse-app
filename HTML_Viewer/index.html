<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Viewer & Formatter - Utiliverse</title>
  <meta name="description" content="Free online HTML Viewer, Formatter, and Minifier. View your HTML code in real-time.">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- JS Beautify for HTML Formatting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.9/beautify-html.min.js"></script>

  <style>
    /* =========================================================
       DARK MODE & THEME STYLES
    ========================================================= */

    body.dark-mode {
      background-color: #0f172a !important;
      color: #e2e8f0 !important;
    }

    body.dark-mode header {
      background-color: rgba(15, 23, 42, 0.90) !important;
      border-color: #334155 !important;
    }

    body.dark-mode header .text-slate-900 {
      color: #f8fafc !important;
    }

    body.dark-mode header .text-slate-500 {
      color: #94a3b8 !important;
    }

    body.dark-mode .tool-container {
      background-color: #1e293b !important;
      border-color: #334155 !important;
    }

    body.dark-mode .tool-header {
      background-color: #334155 !important;
      border-color: #475569 !important;
    }
    
    body.dark-mode .tool-header span {
      color: #f8fafc !important;
    }

    body.dark-mode .action-btn {
      background-color: #1e293b !important;
      border-color: #475569 !important;
      color: #e2e8f0 !important;
    }

    body.dark-mode .action-btn:hover {
      background-color: #334155 !important;
    }

    body.dark-mode .action-btn-danger {
      color: #fb7185 !important;
    }

    body.dark-mode textarea {
      background-color: #0f172a !important;
      color: #cbd5e1 !important;
      border-color: #334155 !important;
    }

    body.dark-mode iframe {
      background-color: #ffffff !important; /* Keep preview background white to accurately render HTML */
    }

    /* =========================================================
       DARK MODE TOGGLE
    ========================================================= */

    .theme-toggle {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 13px;
      border-radius: 9999px;
      border: 1px solid #e2e8f0;
      background: #ffffff;
      color: #334155;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .theme-toggle:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }

    body.dark-mode .theme-toggle {
      background: #1e293b;
      border-color: #475569;
      color: #e2e8f0;
    }

    body.dark-mode .theme-toggle:hover {
      background: #334155;
    }

    .theme-icon {
      width: 17px;
      height: 17px;
    }

    /* Smooth Transitions */
    body, header, .tool-container, .tool-header, textarea, .action-btn, .theme-toggle {
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }
    
    /* Scrollbar for textarea */
    textarea::-webkit-scrollbar {
      width: 8px;
    }
    textarea::-webkit-scrollbar-track {
      background: transparent;
    }
    textarea::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 4px;
    }
    body.dark-mode textarea::-webkit-scrollbar-thumb {
      background-color: #475569;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col font-sans">

  <!-- =========================================================
       NAVIGATION HEADER
  ========================================================= -->
  <header class="sticky top-0 z-50 bg-white/80 backdrop-filter backdrop-blur-lg border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- Logo -->
      <a href="/" class="flex items-center gap-2 hover:opacity-90 transition">
        <div class="bg-indigo-600 text-white p-2 rounded-xl">
          <i data-lucide="layers" class="w-6 h-6"></i>
        </div>
        <span class="text-xl font-bold tracking-tight text-slate-900">
          Utiliverse
        </span>
      </a>

      <!-- Right Side -->
      <div class="flex items-center gap-4">
        <div class="hidden sm:block text-sm font-medium text-slate-500">
          100% Free & Browser-Based
        </div>
        <!-- DARK MODE BUTTON -->
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle light/dark mode">
          <i id="themeIcon" data-lucide="moon" class="theme-icon"></i>
          <span id="themeText">Dark Mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- =========================================================
       MAIN TOOL AREA
  ========================================================= -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full flex flex-col">
    
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-3xl font-bold text-slate-900 flex items-center gap-3">
          <i data-lucide="code" class="w-8 h-8 text-indigo-600"></i>
          HTML Viewer & Formatter
        </h1>
        <p class="text-slate-500 mt-1 text-sm">Write, format, minify, and preview HTML instantly.</p>
      </div>
    </div>

    <!-- 2-Column Grid layout -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-grow min-h-[65vh]">
      
      <!-- COLUMN 1: Editor -->
      <div class="tool-container flex flex-col bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden h-full">
        <!-- Editor Header & Controls -->
        <div class="tool-header bg-slate-100/50 px-4 py-3 border-b border-slate-200 flex flex-wrap gap-2 justify-between items-center">
          <span class="font-semibold text-slate-700 flex items-center gap-2">
            <i data-lucide="file-code" class="w-4 h-4 text-slate-500"></i> Input HTML
          </span>
          <div class="flex gap-2">
            <button onclick="formatCode()" class="action-btn flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 text-sm font-medium text-slate-700 shadow-sm transition">
              <i data-lucide="align-left" class="w-4 h-4"></i> Beautify
            </button>
            <button onclick="minifyCode()" class="action-btn flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 text-sm font-medium text-slate-700 shadow-sm transition">
              <i data-lucide="minimize-2" class="w-4 h-4"></i> Minify
            </button>
            <button onclick="copyCode()" id="copyBtn" class="action-btn flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 text-sm font-medium text-slate-700 shadow-sm transition">
              <i data-lucide="copy" class="w-4 h-4"></i> Copy
            </button>
            <button onclick="clearCode()" class="action-btn action-btn-danger flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 text-sm font-medium text-rose-600 shadow-sm transition">
              <i data-lucide="trash-2" class="w-4 h-4"></i> Clear
            </button>
          </div>
        </div>
        
        <!-- Textarea -->
        <textarea id="htmlInput" class="w-full flex-grow p-4 bg-slate-50/50 font-mono text-sm leading-relaxed focus:outline-none resize-none" placeholder="<!-- Paste or type your HTML here -->
<div class='example'>
  <h1>Hello Utiliverse!</h1>
  <p>Start typing to see the live preview.</p>
</div>"></textarea>
      </div>

      <!-- COLUMN 2: Preview -->
      <div class="tool-container flex flex-col bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden h-full">
        <!-- Preview Header -->
        <div class="tool-header bg-slate-100/50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
          <span class="font-semibold text-slate-700 flex items-center gap-2">
            <i data-lucide="layout" class="w-4 h-4 text-slate-500"></i> Live Preview
          </span>
        </div>
        
        <!-- Output Iframe -->
        <iframe id="previewFrame" class="w-full flex-grow bg-white border-0" sandbox="allow-scripts allow-modals"></iframe>
      </div>

    </div>
  </main>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    const htmlInput = document.getElementById('htmlInput');
    const previewFrame = document.getElementById('previewFrame');

    // Default template execution on load
    document.addEventListener("DOMContentLoaded", () => {
      if(!htmlInput.value) {
        htmlInput.value = `<!-- Welcome to the HTML Viewer -->
<div style="font-family: sans-serif; text-align: center; padding: 2rem;">
  <h1 style="color: #4f46e5;">Hello, Utiliverse!</h1>
  <p style="color: #64748b;">Start typing in the editor to see your HTML render in real-time.</p>
  <button style="background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;" onclick="alert('Scripts work too!')">Click Me</button>
</div>`;
      }
      updatePreview();
      initTheme();
    });

    // Update preview instantly on input
    htmlInput.addEventListener('input', updatePreview);

    function updatePreview() {
      // Create a blob and use URL.createObjectURL for better isolation and script execution
      const htmlContent = htmlInput.value;
      previewFrame.srcdoc = htmlContent;
    }

    function formatCode() {
      if (!htmlInput.value.trim()) return;
      // Using js-beautify to neatly format the HTML
      htmlInput.value = html_beautify(htmlInput.value, {
        indent_size: 2,
        space_in_empty_paren: true,
        wrap_line_length: 0,
        preserve_newlines: true,
        max_preserve_newlines: 2
      });
      updatePreview();
    }

    function minifyCode() {
      if (!htmlInput.value.trim()) return;
      // Basic regex minification (removes spaces between tags and line breaks)
      let minified = htmlInput.value
        .replace(/<!--[\s\S]*?-->/g, '') // Remove comments
        .replace(/>\s+</g, '><')        // Remove space between tags
        .replace(/\n/g, '')             // Remove newlines
        .replace(/\s{2,}/g, ' ')        // Collapse multiple spaces
        .trim();
      
      htmlInput.value = minified;
      updatePreview();
    }

    function clearCode() {
      htmlInput.value = '';
      updatePreview();
      htmlInput.focus();
    }

    function copyCode() {
      if (!htmlInput.value) return;
      navigator.clipboard.writeText(htmlInput.value).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        const originalContent = copyBtn.innerHTML;
        copyBtn.innerHTML = `<i data-lucide="check" class="w-4 h-4 text-emerald-600"></i> <span class="text-emerald-600">Copied!</span>`;
        lucide.createIcons();
        setTimeout(() => {
          copyBtn.innerHTML = originalContent;
          lucide.createIcons();
        }, 2000);
      });
    }

    /* =========================================================
       DARK MODE LOGIC 
    ========================================================= */
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const themeText = document.getElementById('themeText');

    function initTheme() {
      // Check localStorage or system preference
      if (localStorage.getItem('theme') === 'dark' || 
          (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark-mode');
        updateThemeUI(true);
      }
    }

    themeToggle.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-mode');
      updateThemeUI(isDark);
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    function updateThemeUI(isDark) {
      if (isDark) {
        themeIcon.setAttribute('data-lucide', 'sun');
        themeText.textContent = 'Light Mode';
      } else {
        themeIcon.setAttribute('data-lucide', 'moon');
        themeText.textContent = 'Dark Mode';
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
